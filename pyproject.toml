[build-system]
requires = ["setuptools>=77.0", "wheel", "cmake>=3.15", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_core"
version = "3.0.0"
description = "C++ Machine Learning Library with Python Bindings"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.11,<3.12"
authors = [{ name = "Maurizio Penna" }]
keywords = ["machine-learning", "neural-network", "linear-regression", "python-bindings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/codinglab42/machineLearning"
Repository = "https://github.com/codinglab42/machineLearning"
Documentation = "https://github.com/codinglab42/machineLearning/tree/main/docs"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools]
include-package-data = true