[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_core"
version = "2.0.1"
description = "C++ Machine Learning Library with Python Bindings"
readme = "README.md"
requires-python = ">=3.8"

# Dichiara a setuptools che questi campi arrivano da setup.py
dynamic = ["authors", "classifiers", "urls"]

dependencies = [
    "numpy>=1.20.0",
]

[tool.setuptools]
include-package-data = true