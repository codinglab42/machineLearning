[build-system]
requires = ["setuptools>=77.0", "wheel", "cmake>=3.15", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_core"
version = "3.0.0"
description = "C++ Machine Learning Library with Python Bindings"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
requires-python = ">=3.11,<3.12"

# Dichiara a setuptools che questi campi arrivano da setup.py
dynamic = ["authors", "classifiers", "urls"]

dependencies = [
    "numpy>=1.20.0",
]

[tool.setuptools]
include-package-data = true